name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: testes (${{ matrix.so }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # O `shell: bash` nao e enfeite: no PowerShell do runner o glob
      # `testes/*.test.js` chega ao node como texto literal.
      - name: as regras e os numeros do README
        shell: bash
        run: node --test testes/nucleo.test.js testes/medidas.test.js
      - name: o 32x33 e a poda medida nele
        shell: bash
        run: node --test testes/pesados.test.js

  medidas:
    name: tabelas do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ladrilhamentos dos retangulos pequenos
        run: node ferramentas/medidor.js pequenos
      - name: as faixas contra as formulas
        run: node ferramentas/medidor.js faixas
      - name: horizonte contra grade
        run: node ferramentas/medidor.js duelo
      - name: o menor retangulo perfeito
        run: node ferramentas/medidor.js primeiro
      - name: o que a poda de lado repetido vale
        run: node ferramentas/medidor.js poda
